<!-- Agla chhota step: form aur preventDefault -->

<form id="myForm">
    <input type="text" id="nameInputs" placeholder="Naam likho">
    <button type="submit">Send</button>
  </form>
  <p id="outputss"></p>

  <script>

let form = document.querySelector("#myForm");
let nameInputs = document.querySelector("#nameInputs");

let outputss = document.querySelector("#outputss");

form.addEventListener("submit",function(event){
   event.preventDefault();
  outputss.textContent = "Hello " + nameInputs.value;
});
</script>

<!-- .parentElement -->

 <ul>
    <li>Milk <button>Delete</button></li>
    <li>Bread <button>Delete</button></li>
    <li>Eggs <button>Delete</button></li>
  </ul>

  <script>
    let buttons = document.querySelectorAll("button");

    for (let i = 0; i < buttons.length; i++) {
      buttons[i].addEventListener("click", function(event) {
        event.target.parentElement.remove();
      });
    }
  </script>

  <ul id="listt"></ul>

  <script>
    let itemst = ["Milk", "Bread", "Eggsss"];
    let listt = document.querySelector("#listt");

    for (let i = 0; i < itemst.length; i++) {

  </script>
