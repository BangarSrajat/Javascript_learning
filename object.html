  <div class="box">
    <p><span id="text"></span></p>
    <button id="Changebtn">Change</button>
  </div>

  <script>
     let textadd = { 
        name: "Rahul",
        age:25,
     }

     let text = document.getElementById("text");
     let btn= document.getElementById("Changebtn");
     function changeText(){
       textadd.age = textadd.age +1 ;
        text.textContent = textadd.age;
     }

     btn.addEventListener("click", function(){
        changeText();
     });
     changeText();
    </script>

<div id="productCard"></div>
<button id="discountBtn">Apply 20% Discount</button>
<script>
    let product = {
  name: "Laptop",
  price: 50000,
  inStock: true
};

let productCard =document.getElementById("productCard");
let discuntBtn = document.getElementById("discountBtn");


function renderProduct(){
    productCard.innerHTML="<h3>" + product.name + "</h3><p>Price: " + product.price + "</p>";
}
renderProduct();

discuntBtn.addEventListener("click",function(){
    product.price = product.price - (product.price *20/100);
    renderProduct();
})
</script>
