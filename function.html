<script>
   function checkPalindrome(word) {
  let reversed = word.split("").reverse().join("");
  
  if (word === reversed) {
    return "Palindrome hai";   // yahan kya likhoge?
  } else {
    return "Palindrome nahi";   // yahan kya likhoge?
  }
}

console.log(checkPalindrome("hello"));




</script>
