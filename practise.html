<script>
    let nam1 = 20;
let nam2 = 10;
let operator = "*";
// operator ki value 
switch(operator){
    case "+":
        console.log(nam1+nam2);
        break;
        case "-":
            console.log(nam1-nam2);
            break;
             case "*":
                console.log(nam1*nam2);
                break;
                  case "/":
        console.log(nam1 / nam2);
        break;

    case "%":
        console.log(nam1 % nam2);
        break;
                default:
                console.log("Invalid");
}
</script>
