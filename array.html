    console.log(i);

<script>
    // constructor new aaray banana k tarkiaa

    let colors= new Array("pin","Mkl");
    console.log(colors);
</script>

<script>
    //push isme hum add me value add karta hai

    let bike =["Honda","Apahce","Gixer"];
    bike.push("R1z");
    console.log(bike);
</script>

<script>
    //pop isme hum end se value delete kartah hia
     let bikes =["Honda","Apahce","Gixer"];
    bikes.pop();
    console.log(bikes);
</script>

<script>
    //shift isme am shur me value hatata hai 
    let car=["Volovo","punch","alto"];
    car.shift();
    console.log(car);
</script>



<script>
    //unshift isme am shur me value add karte hia 
    let cars=["Volovo","punch","alto"];
    cars.unshift("naxon");
    console.log(cars);
</script>

<script>
    // indexOf() position dundna value ki

    let name = ["SHubham","chintu","Pankaj"];
    console.log(name.indexOf("chintu"));
</script>

<script>
    // includes() — Check Karna Value Hai Ya Nahi
     let names = ["SHubham","chintu","Pankaj"];
    console.log(names.includes("rani"));
</script>

<script>
    //slice() — Array Ka Part Nikalna (Original Nahi Badalta)
    let numbers = [1, 2, 3, 4, 5];
console.log(numbers.slice(1, 3));
</script>

<script>
    //join() Array Ko String Mein Convert Karna

    let namess = ["SHubham","chintu","Pankaj"];
    console.log(namess.join(","));
</script>


<!-- JavaScript Array Search -->

<script>
    //indexOf() — Position Dhundna (Jo Humne Abhi Dekha)

    let fruits = ["Apple", "Banana", "Mango"];
console.log(fruits.indexOf("Banana"));   // 1
console.log(fruits.indexOf("Orange"));   // -1 (nahi mila, isliye -1)
</script>

<script>
    //2. lastIndexOf() — Aakhri Baar Kaha Mili
    let numberss = [10, 20, 30, 20, 10];
console.log(numberss.indexOf(20));       // 1 (pehli baar mili)
console.log(numberss.lastIndexOf(20));   // 3 (aakhri baar mili)
</script>


<script>
    //find() — Condition Ke Basis Pe Value Dhundna

    let nam =  [5, 7, 10, 20, 3];
    let found  =nam.find(function(num){
        return num>10;
    });
    console.log(found);
</script>

<script>
    //findIndex() — Condition Ke Basis Pe Position Dhundna
    let namesss =  [5, 7, 0, 20, 3];
    let founds  = namesss.findIndex(function(numesss){
        return numesss>10;
    });
    console.log(founds);
</script>


<script>
    let cart = ["Shirt", "Shoes", "Watch"];

if (cart.includes("Shoes")) {
  console.log("Item already in cart");
} else {
  cart.push("Shoes");
  console.log("Item added to cart");
}
</script>


<!-- JavaScript Array Sort -->


<script>
    //alphabetically arrange kar deta hai — bina kuch extra likhe.
    const fruitss = ["Banana", "Orange", "Apple", "Mango"];
fruitss.sort();
console.log(fruitss); 
</script>

<script>
    //The reverse() method reverses the elements in an array:
     const fruitsss = ["Banana", "Orange", "Apple", "Mango"];
fruitsss.reverse();
console.log(fruitsss);
</script>

<p id="demo"></p>

<script>
const months = ["Jan", "Feb", "Mar", "Apr"];
