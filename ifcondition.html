  <script>

 function checkNumber(num) {
  if (num === 0) {
    console.log("Zero");
  } 
  else if (num > 0 && num % 2 === 0) {
    // ye condition kab true hoti hai? Jab number positive HO aur even HO
    console.log("Positive Even");   // ✅ isliye ye message
  } 
  else if (num > 0 && num % 2 !== 0) {
    // ye kab true hoti hai? Jab number positive HO aur odd HO
    console.log("Positive Odd");   // ✅ isliye ye message
  } 
  else {
    // agar upar koi bhi condition match na ho, to number negative hi bacha
    console.log("Negative");   // ✅ isliye ye message
  }
}

checkNumber(7);
</script>

<script>
    function calculator(num1, num2, operator) {
  if (operator === "+") {
    console.log(num1 + num2);
  } else if (operator === "-") {
    console.log(num1 - num2);
  } else if (operator === "*") {
    console.log(num1 * num2);
  } else if (operator === "/") {
    if (num2 === 0) {
      console.log("Error: Divide by zero nahi kar sakte!");
    } else {
      console.log(num1 / num2);
    }
  } else {
    console.log("Invalid operator! Sirf +, -, *, / use karo");
  }
}

calculator(10, 5, "+");   // 15
calculator(10, 5, "-");   // 5
calculator(10, 5, "*");   // 50
calculator(10, 5, "/");   // 2
calculator(10, 0, "/");   // Error message
calculator(10, 5, "%");   // Invalid operator
</script>
